<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard - Salah Reminder</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="nav-container">
      <a href="/dashboard.html" class="brand-logo">
        <i class="fas fa-kaaba"></i>
        <span>Salah Reminder</span>
      </a>
      <div class="nav-links">
        <button id="logoutBtn" class="btn-logout">
          <i class="fas fa-sign-out-alt"></i> Logout
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main-wrapper">
    
    <!-- Hero Header Banner -->
    <div class="dashboard-header">
      <div class="user-greeting">
        <h2>Assalamu Alaikum, <span id="userName">User</span> 👋</h2>
        <p><i class="fas fa-location-dot" style="color: var(--accent-gold);"></i> Location: <span id="userLocation">Loading...</span></p>
      </div>
      <div class="date-badge-box">
        <div class="gregorian" id="gregorianDate">Loading Date...</div>
        <div class="hijri" id="hijriDate">Loading Hijri Date...</div>
      </div>
    </div>

    <!-- Section 1: Today's Prayer Times & Status Badges -->
    <div class="section-title">
      <i class="fas fa-clock"></i> Today's Prayer Schedule & Attendance
    </div>

    <div class="prayer-grid" id="prayerGrid">
      <div class="prayer-card">
        <div class="prayer-card-icon"><i class="fas fa-circle-notch fa-spin"></i></div>
        <div class="prayer-name">Loading...</div>
      </div>
    </div>

    <!-- Section 2: Weekly Attendance Summary Widget -->
    <div class="weekly-widget">
      <div class="section-title" style="margin-bottom: 0;">
        <i class="fas fa-chart-simple"></i> Past 7 Days Attendance Summary
      </div>
      <p style="font-size: 0.88rem; color: var(--text-muted); margin-top: 4px;">Number of prayers completed per day out of 5</p>

      <div class="weekly-grid" id="weeklyGrid">
        <!-- JS injects weekly progress bars here -->
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 Salah Reminder. All rights reserved.</p>
  </footer>

  <script src="/js/dashboard.js"></script>
</body>
</html>
