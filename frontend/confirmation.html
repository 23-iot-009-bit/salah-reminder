<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance Confirmation - Salah Reminder</title>
  <link rel="stylesheet" href="/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="/index.html" class="brand-logo">
        <i class="fas fa-kaaba"></i>
        <span>Salah Reminder</span>
      </a>
    </div>
  </header>

  <main class="main-wrapper">
    <div class="confirmation-container">
      <div class="card" style="padding: 3rem 2rem;">
        <i id="confirmationIcon" class="fas fa-check-circle confirmation-icon success"></i>
        <h2 id="confirmationTitle" style="color: var(--primary-dark); margin-bottom: 12px;">Attendance Recorded</h2>
        <p id="confirmationMessage" style="font-size: 1.05rem; color: var(--text-dark); margin-bottom: 2rem;">Processing your response...</p>

        <a href="/dashboard.html" class="btn-primary" style="display: inline-block; width: auto; padding: 0.8rem 2rem;">Go to Dashboard</a>
      </div>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Salah Reminder. All rights reserved.</p>
  </footer>

  <script src="/js/confirmation.js"></script>
</body>
</html>
